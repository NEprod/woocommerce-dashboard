services:
  app:
    image: neprod/woocommerce-dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: woocommerce-dashboard
    restart: unless-stopped
    ports:
      - "${APP_PORT:-7485}:7485"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      PUID: "${PUID:-100}"
      PGID: "${PGID:-100}"
      UMASK: "${UMASK:-002}"
    volumes:
      - "${INSTANCE_FOLDER_HOST}:/app/instance"
      - "${PRODUCT_FOLDER_HOST}:/catalogue"
      - "${OUTPUT_FOLDER_HOST}:/output"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7485/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

<!-- Head partial for TLC Dashboard -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}{% endblock %} | Tender Loving Creations</title>

<meta name="title" content="Tender Loving Creations Admin">
<meta name="description" content="Manage your TLC products, orders, and settings with ease.">
<link rel="canonical" href="{{ url_for('main.dashboard') }}">

<!-- Favicon -->
<link rel="apple-touch-icon" sizes="120x120" href="{{ url_for('static', filename='assets/img/favicon/tlc-icon-120.png') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='assets/img/favicon/tlc-icon-32.png') }}">
<meta name="theme-color" content="#A97155">

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome for icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<!-- Vendor styles -->
<link rel="stylesheet" href="{{ url_for('static', filename='assets/vendor/sweetalert2/dist/sweetalert2.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='assets/vendor/notyf/notyf.min.css') }}">

<!-- TLC Custom Styles -->
<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/custom.css') }}">

{% block stylesheets %}{% endblock %}
